<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>رسّام+</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6c4cf1">
<style>
:root{--bg:#f6f5fb;--card:#fff;--tx:#1d1b2e;--mu:#7a7790;--pr:#6c4cf1;--ac:#ff6b9d;--bd:#e6e3f3;color-scheme:light}
:root[data-t=dark]{--bg:#14121f;--card:#1f1c30;--tx:#f1effa;--mu:#9a96b5;--bd:#2f2b47;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:var(--card);border:1px solid var(--bd)}
button.p{background:linear-gradient(135deg,var(--pr),var(--ac));color:#fff;border:0;font-weight:700}
button.d{color:#e5484d}
input,select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);margin:5px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:12px 0}
.wrap{max-width:760px;margin:0 auto;padding:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}
h1{font-size:30px;background:linear-gradient(135deg,var(--pr),var(--ac));-webkit-background-clip:text;color:transparent;display:inline-block}
.mu{color:var(--mu);font-size:13px}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd);gap:8px}
.hide{display:none!important}
#splash{position:fixed;inset:0;background:linear-gradient(135deg,var(--pr),var(--ac));display:grid;place-items:center;color:#fff;font-size:44px;font-weight:800;z-index:99;transition:opacity .4s}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:50}
#toast div{background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;animation:in .25s}
@keyframes in{from{opacity:0;transform:translateY(-8px)}}
#room{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.top{display:flex;gap:6px;padding:6px 8px;align-items:center;border-bottom:1px solid var(--bd);background:var(--card)}
.top b{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.top button{padding:7px 10px}
#stage{flex:1;min-height:0;display:grid;place-items:center;padding:8px;overflow:hidden}
#box{position:relative;aspect-ratio:3/2;max-width:100%;max-height:100%;width:100%;background:#fff;border-radius:12px;box-shadow:0 4px 24px #0003;touch-action:none}
#box canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:12px;touch-action:none}
.tools{display:flex;gap:6px;padding:8px;overflow-x:auto;background:var(--card);border-top:1px solid var(--bd);align-items:center}
.tools button{padding:8px 12px;white-space:nowrap}.tools button.on{background:var(--pr);color:#fff}
.tools input[type=color]{width:42px;height:38px;padding:2px;margin:0;flex:none}.tools input[type=range]{width:90px;margin:0;flex:none}
#side{position:absolute;top:calc(48px + env(safe-area-inset-top));bottom:calc(58px + env(safe-area-inset-bottom));inset-inline-start:0;width:min(330px,92vw);background:var(--card);border-inline-end:1px solid var(--bd);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s;z-index:5}
#side.open{transform:none}
#chat{flex:1;overflow:auto;padding:10px;font-size:14px}#chat p{margin:4px 0;word-break:break-word}#chat b{color:var(--pr)}
#players{padding:8px 10px;border-bottom:1px solid var(--bd);max-height:35%;overflow:auto;font-size:14px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2fbf71;margin-inline-end:6px}
</style>
</head>
<body>
<div id="splash">رسّام+</div><div id="toast"></div>
<div id="app"></div>
<div id="room" class="hide"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,GoogleAuthProvider,signInWithPopup,signInAnonymously,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,updateProfile} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getDatabase,ref,set,get,push,update,remove,onValue,onChildAdded,onChildRemoved,onDisconnect,serverTimestamp,query,limitToLast} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const cfg={apiKey:"AIzaSyDh6XiKDSRFPy6gOTDlCHi7T2_u0oYDNHI",authDomain:"sawe-317bb.firebaseapp.com",
 databaseURL:"https://sawe-317bb-default-rtdb.firebaseio.com",projectId:"sawe-317bb",
 storageBucket:"sawe-317bb.firebasestorage.app",messagingSenderId:"87026218974",appId:"1:87026218974:web:8d3c07566ad972b7de8f4f"};
const fb=initializeApp(cfg),auth=getAuth(fb),db=getDatabase(fb);
const W=1200,H=800;
let me=null,cleanups=[];

// ---------- helpers ----------
const $=s=>document.querySelector(s);
function h(tag,props={},...kids){const e=document.createElement(tag);
 for(const[k,v]of Object.entries(props)){if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(k==="class")e.className=v;else e[k]=v}
 kids.flat().forEach(c=>e.append(c instanceof Node?c:document.createTextNode(c??"")));return e}
function toast(t){const d=h("div",{},t);$("#toast").append(d);setTimeout(()=>d.remove(),3000)}
const err=e=>toast(({"auth/invalid-credential":"بيانات الدخول غير صحيحة","auth/email-already-in-use":"الإيميل مستخدم بالفعل","auth/weak-password":"كلمة السر ضعيفة (6 أحرف على الأقل)","PERMISSION_DENIED":"غير مسموح لك بهذا الإجراء"})[e.code||e.message]||("خطأ: "+(e.code||e.message)));
const code6=()=>Array.from(crypto.getRandomValues(new Uint8Array(6)),b=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[b%32]).join("");
const nm=()=>(me.displayName||"ضيف"+me.uid.slice(0,4)).slice(0,24);
const link=(id,c)=>location.origin+location.pathname+"#/r/"+id+(c?"/"+c:"");
document.documentElement.dataset.t=localStorage.t||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
const flipTheme=()=>{const t=document.documentElement.dataset.t==="dark"?"light":"dark";document.documentElement.dataset.t=t;localStorage.t=t};

// ---------- auth ----------
onAuthStateChanged(auth,u=>{me=u;setTimeout(()=>{$("#splash").style.opacity=0;setTimeout(()=>$("#splash").remove(),400)},500);route()});
addEventListener("hashchange",route);

function authView(){
 const em=h("input",{type:"email",placeholder:"الإيميل",autocomplete:"email"}),pw=h("input",{type:"password",placeholder:"كلمة السر",autocomplete:"current-password"}),un=h("input",{placeholder:"اسمك (عند إنشاء حساب)",maxLength:24});
 const go=f=>async()=>{try{
  if(f==="up"){const c=await createUserWithEmailAndPassword(auth,em.value,pw.value);await updateProfile(c.user,{displayName:un.value.trim()||em.value.split("@")[0]})}
  else await signInWithEmailAndPassword(auth,em.value,pw.value);route()}catch(e){err(e)}};
 return h("div",{class:"wrap"},h("div",{class:"card",style:"text-align:center;margin-top:8vh"},h("h1",{},"رسّام+"),h("p",{class:"mu"},"ارسم مع أصحابك لحظيًا"),
  h("button",{class:"p",style:"width:100%;margin:14px 0 6px",onclick:()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(err)},"الدخول بحساب Google"),
  em,pw,un,h("div",{class:"row"},h("button",{class:"p",onclick:go("in")},"دخول"),h("button",{onclick:go("up")},"إنشاء حساب")),
  h("button",{style:"width:100%;margin-top:8px",onclick:()=>signInAnonymously(auth).catch(err)},"دخول كضيف")))}

// ---------- home ----------
function homeView(){
 const list=h("div"),nameI=h("input",{placeholder:"اسم الغرفة",maxLength:30}),cap=h("select",{},...[2,4,8,16].map(n=>h("option",{value:n},n+" لاعبين"))),
  vis=h("select",{},h("option",{value:"1"},"عامة (تظهر للجميع)"),h("option",{value:"0"},"خاصة (بكود/رابط)")),codeI=h("input",{placeholder:"كود الدعوة أو رابط الغرفة"});
 const q=onValue(query(ref(db,"publicRooms"),limitToLast(30)),s=>{list.replaceChildren();
  if(!s.exists())return list.append(h("p",{class:"mu"},"لا توجد غرف عامة الآن. أنشئ أول غرفة!"));
  s.forEach(c=>{const r=c.val();list.prepend(h("div",{class:"item"},h("div",{},h("b",{},r.name),h("div",{class:"mu"},"بواسطة "+r.ownerName+" • حتى "+r.cap)),h("button",{class:"p",onclick:()=>location.hash="#/r/"+c.key},"دخول")))})},err);
 cleanups.push(q);
 const create=async()=>{const n=nameI.value.trim();if(!n)return toast("اكتب اسم الغرفة");
  const id=push(ref(db,"rooms")).key,pub=vis.value==="1",c=code6();
  try{await set(ref(db,"rooms/"+id+"/meta"),{name:n,owner:me.uid,ownerName:nm(),cap:+cap.value,public:pub,t:serverTimestamp()});
   await set(ref(db,"rooms/"+id+"/secret"),c);
   if(pub)await set(ref(db,"publicRooms/"+id),{name:n,owner:me.uid,ownerName:nm(),cap:+cap.value,t:serverTimestamp()});
   location.hash="#/r/"+id+"/"+c}catch(e){err(e)}};
 const joinCode=()=>{const m=codeI.value.match(/#\/r\/([\w-]+)(?:\/(\w+))?/);m?location.hash="#/r/"+m[1]+(m[2]?"/"+m[2]:""):toast("الصق رابط الغرفة الكامل")};
 return h("div",{class:"wrap"},h("div",{class:"row",style:"margin-bottom:6px"},h("h1",{},"رسّام+"),h("span",{class:"mu"},"أهلًا "+nm()),h("button",{onclick:flipTheme},"🌓"),h("button",{onclick:()=>signOut(auth)},"خروج")),
  h("div",{class:"card"},h("h3",{},"إنشاء غرفة"),nameI,h("div",{class:"row"},cap,vis),h("button",{class:"p",style:"width:100%;margin-top:6px",onclick:create},"إنشاء الغرفة")),
  h("div",{class:"card"},h("h3",{},"الغرف العامة"),list),
  h("div",{class:"card"},h("h3",{},"الدخول برابط دعوة"),codeI,h("button",{style:"width:100%",onclick:joinCode},"انضم")))}

// ---------- room ----------
async function roomView(id,code){
 const R=p=>ref(db,"rooms/"+id+"/"+p),mine=[];let meta,owner=false,muted=false,tool="pen",strokes=new Map(),live={};
 try{await set(R("members/"+me.uid),{name:nm(),code:code||null,t:serverTimestamp()});
  meta=(await get(R("meta"))).val();if(!meta)throw 0;owner=meta.owner===me.uid;
  const ms=await get(R("members"));if(!owner&&ms.size>meta.cap){await remove(R("members/"+me.uid));toast("الغرفة ممتلئة");return location.hash="#/"}
 }catch(e){toast("لا يمكن دخول الغرفة (محظور أو كود خاطئ أو غير موجودة)");return location.hash="#/"}
 const root=$("#room");root.classList.remove("hide");$("#app").classList.add("hide");
 const pres=R("presence/"+me.uid);set(pres,{name:nm()});onDisconnect(pres).remove();

 const box=h("div",{id:"box"}),cv=h("canvas",{width:W,height:H}),lv=h("canvas",{width:W,height:H});box.append(cv,lv);
 const cx=cv.getContext("2d"),lx=lv.getContext("2d");
 const draw=(c,s)=>{const p=s.p.split(";").map(a=>a.split(",").map(Number));c.strokeStyle=s.c;c.lineWidth=s.w;c.lineCap=c.lineJoin="round";c.beginPath();c.moveTo(p[0][0],p[0][1]);
  if(p.length===1)c.lineTo(p[0][0]+.1,p[0][1]);p.slice(1).forEach(a=>c.lineTo(a[0],a[1]));c.stroke()};
 const redraw=()=>{cx.clearRect(0,0,W,H);strokes.forEach(s=>draw(cx,s))};
 const redrawLive=()=>{lx.clearRect(0,0,W,H);Object.values(live).forEach(s=>s&&s.p&&draw(lx,s))};

 const color=h("input",{type:"color",value:"#6c4cf1"}),size=h("input",{type:"range",min:2,max:40,value:6});
 const tb=(t,l)=>{const b=h("button",{class:t==="pen"?"on":"",onclick:()=>{tool=t;tools.querySelectorAll("button[data-t]").forEach(x=>x.classList.toggle("on",x===b))}},l);b.dataset.t=t;return b};
 const undo=h("button",{onclick:()=>{const k=mine.pop();k&&remove(R("strokes/"+k))}},"↩ تراجع");
 const clear=h("button",{class:"d "+(owner?"":"hide"),onclick:()=>confirm("مسح اللوحة للجميع؟")&&remove(R("strokes"))},"🗑 مسح");
 const save=h("button",{onclick:()=>{const o=document.createElement("canvas");o.width=W;o.height=H;const c=o.getContext("2d");c.fillStyle="#fff";c.fillRect(0,0,W,H);c.drawImage(cv,0,0);const a=h("a",{href:o.toDataURL("image/png"),download:"rassam-"+Date.now()+".png"});a.click()}},"⬇ PNG");
 const tools=h("div",{class:"tools"},tb("pen","✏️ قلم"),tb("eraser","🧽 ممحاة"),color,size,undo,save,clear);

 let cur=null,last=0;
 const pt=e=>{const r=cv.getBoundingClientRect();return[Math.round((e.clientX-r.left)/r.width*W),Math.round((e.clientY-r.top)/r.height*H)]};
 const canDraw=()=>!muted||toast("تم كتمك من الرسم");
 box.addEventListener("pointerdown",e=>{if(!canDraw())return;box.setPointerCapture(e.pointerId);const[x,y]=pt(e);
  cur={c:tool==="eraser"?"#ffffff":color.value,w:tool==="eraser"?+size.value*3:+size.value,pts:[[x,y]]};lx.clearRect(0,0,W,H);draw(lx,{...cur,p:x+","+y})});
 box.addEventListener("pointermove",e=>{if(!cur)return;for(const ev of(e.getCoalescedEvents?.()||[e]))cur.pts.push(pt(ev));
  const s={c:cur.c,w:cur.w,p:cur.pts.map(a=>a.join(",")).join(";")};
  if(cur.pts.length>1){draw(lx,s)}
  if(Date.now()-last>80){last=Date.now();set(R("live/"+me.uid),s)}});
 const end=async()=>{if(!cur)return;const s={uid:me.uid,c:cur.c,w:cur.w,p:cur.pts.map(a=>a.join(",")).join(";")};cur=null;
  const k=push(R("strokes")).key;mine.push(k);lx.clearRect(0,0,W,H);strokes.set(k,s);draw(cx,s);
  try{await set(R("strokes/"+k),s)}catch(e){strokes.delete(k);mine.pop();redraw();err(e)}remove(R("live/"+me.uid))};
 box.addEventListener("pointerup",end);box.addEventListener("pointercancel",end);

 const on=(q,ev,fn)=>cleanups.push(ev==="value"?onValue(q,fn):ev==="add"?onChildAdded(q,fn):onChildRemoved(q,fn));
 on(R("strokes"),"add",s=>{if(!strokes.has(s.key)){strokes.set(s.key,s.val());draw(cx,s.val())}});
 on(R("strokes"),"rem",s=>{strokes.delete(s.key);redraw()});
 on(R("live"),"value",s=>{live=s.val()||{};delete live[me.uid];redrawLive()});
 on(R("muted/"+me.uid),"value",s=>muted=s.exists());
 // kicked
 on(R("members/"+me.uid),"value",s=>{if(!s.exists()&&!leaving){toast("تم إخراجك من الغرفة");leave()}});

 // players
 const pl=h("div",{id:"players"});let prevP=null;
 on(R("presence"),"value",s=>{const cur=s.val()||{};
  if(prevP){for(const k in cur)if(!prevP[k])toast(cur[k].name+" دخل الغرفة");for(const k in prevP)if(!cur[k])toast(prevP[k].name+" غادر")}prevP=cur;
  pl.replaceChildren(h("b",{},"اللاعبون ("+Object.keys(cur).length+"/"+meta.cap+")"));
  for(const k in cur)pl.append(h("div",{class:"item"},h("span",{},h("span",{class:"dot"}),cur[k].name+(k===meta.owner?" 👑":"")),
   owner&&k!==me.uid?h("span",{},h("button",{onclick:()=>set(R("muted/"+k),true)},"كتم"),h("button",{onclick:()=>remove(R("muted/"+k))},"فك"),h("button",{class:"d",onclick:async()=>{await set(R("banned/"+k),true);await remove(R("members/"+k));remove(R("presence/"+k));remove(R("live/"+k))}},"طرد")):""))});

 // chat
 const chat=h("div",{id:"chat"}),inp=h("input",{placeholder:"اكتب رسالة...",maxLength:300,style:"margin:0"});
 const send=async()=>{const t=inp.value.trim().replace(/[\u0000-\u001f]/g,"");if(!t)return;inp.value="";
  const k=push(R("chat")).key;try{await update(R(""),{["chat/"+k]:{uid:me.uid,name:nm(),text:t,t:serverTimestamp()},["rate/"+me.uid]:serverTimestamp()})}catch(e){toast("مهلاً... رسائل بسرعة أو ممنوع");inp.value=t}};
 inp.addEventListener("keydown",e=>e.key==="Enter"&&send());
 on(query(R("chat"),limitToLast(100)),"add",s=>{const m=s.val();chat.append(h("p",{},h("b",{},m.name+": "),m.text));chat.scrollTop=1e9});
 const side=h("div",{id:"side"},pl,chat,h("div",{class:"row",style:"padding:8px;flex:none"},inp,h("button",{class:"p",style:"flex:none",onclick:send},"إرسال")));

 // top bar
 const dot=h("span",{class:"dot"});on(ref(db,".info/connected"),"value",s=>{dot.style.background=s.val()?"#2fbf71":"#e5484d"});
 let leaving=false;
 const leave=async(del)=>{leaving=true;cleanups.splice(0).forEach(f=>f());try{await remove(pres);if(del)await remove(R("members/"+me.uid))}catch{}root.classList.add("hide");$("#app").classList.remove("hide");location.hash="#/"};
 const share=async()=>{const u=link(id,meta.public?"":(code||(await get(R("secret"))).val()));
  if(navigator.share)navigator.share({title:"رسّام+ — "+meta.name,url:u}).catch(()=>{});else{await navigator.clipboard.writeText(u);toast("تم نسخ رابط الدعوة")}};
 root.replaceChildren(h("div",{class:"top"},dot,h("b",{},meta.name+(meta.public?"":" 🔒")),h("button",{onclick:share},"دعوة"),h("button",{onclick:()=>side.classList.toggle("open")},"💬 👥"),h("button",{onclick:()=>leave(true)},"خروج")),
  h("div",{id:"stage"},box),tools,side);
}

// ---------- router ----------
function route(){
 cleanups.splice(0).forEach(f=>{try{f()}catch{}});$("#room").classList.add("hide");$("#app").classList.remove("hide");
 const app=$("#app");
 if(!me)return app.replaceChildren(authView());
 const m=location.hash.match(/^#\/r\/([\w-]+)(?:\/(\w+))?/);
 if(m){app.replaceChildren(h("div",{class:"wrap"},h("p",{class:"mu"},"جارٍ الدخول..."))); roomView(m[1],m[2])}
 else app.replaceChildren(homeView());
}
</script>
</body>
</html>
